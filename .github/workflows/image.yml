name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      # Default image: no KiCad 3D models (~6 GB). For STEP exports with part
      # bodies, build locally with INSTALL_KICAD_3D=true instead.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            INSTALL_KICAD_3D=false
            INSTALL_CAD=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke test the pushed image: toolchain imports and pcb-check is on PATH.
      - name: Smoke test
        run: |
          docker run --rm --entrypoint sh -u dev "${IMAGE}:latest" -c '
            set -e
            kicad-cli version
            eda-python -c "import pcbnew, kikit, build123d; print(\"pcbnew\", pcbnew.Version())"
            command -v pcb-check ffmpeg ip
          '
